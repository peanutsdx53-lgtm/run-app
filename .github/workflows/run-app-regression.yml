name: Run App regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep a single active attempt for each PR; main push and manual runs are retained.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static-and-science:
    name: Static, storage, scientific evidence and Node tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all local references
        run: node scripts/auditLocalDependencies.mjs
      - name: Check public terminology
        run: node scripts/auditPublicTerminology.mjs
      - name: Run all Node unit and contract tests
        run: node --test tests/*.test.mjs

  browser:
    name: ${{ matrix.engine }} UI and record continuity
    runs-on: ubuntu-24.04
    # Browser and operating-system dependencies are preinstalled at Playwright v1.56.1.
    # Avoid repeated network installations that have exhausted the WebKit job timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install supported browser test tool
        run: npm install --no-save playwright@1.56.1
      - name: Capture bilingual onboarding layout and reject clipped controls
        run: node tests/onboardingBilingualLayoutBrowser.mjs
      - name: Preserve onboarding screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-${{ matrix.engine }}
          path: audit-output/onboarding-${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Inspect Japanese and English Home cards and guide across viewports
        run: node tests/homeCopyBilingualBrowser.mjs
      - name: Preserve Home copy screenshots for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-copy-${{ matrix.engine }}
          path: audit-output/home-copy-${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Photograph condition, achievements, course and Learning in Japanese and English
        run: node tests/uiuxFocusedScreensBrowser.mjs
      - name: Preserve the focused UI screenshots and viewport measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-ui-${{ matrix.engine }}
          path: audit-output/focus-ui-${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Explore all 28 topics and saved-run English surface copy
        env:
          RUNLOAD_EXPLORE_STRICT: '1'
        run: node tests/exploreFullCopyBrowser.mjs
      - name: Preserve exhaustive Explore language and layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explore-copy-${{ matrix.engine }}
          path: audit-output/explore-copy-${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Inventory button contrast and capture dark-mode screens
        run: |
          node tests/buttonContrastAuditBrowser.mjs
          node tests/ux02ContrastMatrixBrowser.mjs
      - name: Verify UX03 nav/zoom bilingual responsive matrix
        run: node tests/ux03NavigationTextZoomBrowser.mjs
      - name: Preserve UX03 navigation and text resizing visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux03-navigation-${{ matrix.engine }}
          path: audit-output/ux03-navigation-${{ matrix.engine }}/
          if-no-files-found: error
          retention-days: 7
      - name: Verify UX04 stable bilingual action copy in Home and Explore
        run: node tests/ux04NavigationCopyBrowser.mjs
      - name: Preserve UX04 keyed action copy and navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux04-action-copy-${{ matrix.engine }}
          path: audit-output/ux04-actions-${{ matrix.engine }}/
          if-no-files-found: error
          retention-days: 7
      - name: Verify UX05 eight-stage onboarding and Home in JA/EN at text zoom
        run: node tests/ux05OnboardingHomeBrowser.mjs
      - name: Preserve UX05 first-use progression and empty Home screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux05-onboarding-home-${{ matrix.engine }}
          path: audit-output/ux05-intro-home-${{ matrix.engine }}/
          if-no-files-found: error
          retention-days: 7
      - name: Verify UX06 manual inputs and save integrity at 32 display conditions
        run: node tests/ux06ManualEntryBrowser.mjs
      - name: Preserve UX06 bilingual responsive manual-entry screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux06-manual-${{ matrix.engine }}
          path: audit-output/ux06-manual-${{ matrix.engine }}/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve button contrast screenshots and computed style inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: button-contrast-${{ matrix.engine }}
          path: audit-output/button-contrast-${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Confirm retired what-if URL, Learning shortcut and actual result export
        run: node tests/uiux06TargetBrowser.mjs
      - name: Verify GPS stage 2 fixed controls, native finish confirmation and stage 1 saved-record integrity
        run: node tests/gpsRofReviewBrowser.mjs
      - name: Preserve stage 1 GPS screenshots for real visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gps-stage2-${{ matrix.engine }}
          path: audit-output/gps-mobile/
          retention-days: 7
          if-no-files-found: warn
      - name: Photograph bilingual save-before review, retry errors and GPS reload recovery
        run: node tests/saveReviewStage4Browser.mjs
      - name: Preserve stage 4 source-aware save, failed-write and recovery screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save-stage4-${{ matrix.engine }}
          path: audit-output/gps-stage4-save/
          if-no-files-found: warn
          retention-days: 7
      - name: Audit unified GPS/manual history and 3 result tabs in JA/EN at five widths
        run: node tests/gpsStage5HistoryResultBrowser.mjs
      - name: Preserve stage 5 history and result screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gps-stage5-${{ matrix.engine }}
          path: audit-output/stage5-history-result/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify stage 6 dynamic GPS speed, gaps, flag-by-flag controls and research reference boundaries
        run: node tests/gpsStage6DynamicBrowser.mjs
      - name: Preserve stage 6 dynamic GPS bilingual screen and viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gps-stage6-${{ matrix.engine }}
          path: audit-output/gps-stage6-dynamic/
          if-no-files-found: warn
          retention-days: 7
      - name: S16 settings help, compact disclosures, and protected deletion across mobile and zoom
        run: node tests/settingsCompactBrowser.mjs
      - name: Preserve S16 settings bilingual/mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-compact-${{ matrix.engine }}
          path: audit-output/settings-compact-${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify bilingual interface
        run: node tests/englishUiBrowser.mjs
      - name: Verify 19 active screen states and retired S18 absence
        run: node tests/screenDesign20PopulatedBrowser.mjs
      - name: Stage 7 inspect 19 active states at 200-percent root font and responsive widths
        env:
          RUNLOAD_P8_FONT200: '1'
          RUNLOAD_P8_WIDTHS: '320,390,768'
        run: node tests/screenDesign20PopulatedBrowser.mjs
      - name: Stage 7 inspect English S01–S20 and Learning at 320px font 200-percent
        env:
          RUNLOAD_ENGLISH_AUDIT_WIDTH: '320'
          RUNLOAD_ENGLISH_FONT200: '1'
          RUNLOAD_STAGE7_CAPTURE_ALL: '1'
        run: node tests/englishSurfaceAuditBrowser.mjs
      - name: Stage 7 inspect English S01–S20 and Learning at 390px font 200-percent
        env:
          RUNLOAD_ENGLISH_AUDIT_WIDTH: '390'
          RUNLOAD_ENGLISH_FONT200: '1'
          RUNLOAD_STAGE7_CAPTURE_ALL: '1'
        run: node tests/englishSurfaceAuditBrowser.mjs
      - name: Stage 7 inspect English S01–S20 and Learning at 768px font 200-percent
        env:
          RUNLOAD_ENGLISH_AUDIT_WIDTH: '768'
          RUNLOAD_ENGLISH_FONT200: '1'
          RUNLOAD_STAGE7_CAPTURE_ALL: '1'
        run: node tests/englishSurfaceAuditBrowser.mjs
      - name: Stage 7 inspect English desktop 1440px and preserve source separation
        env:
          RUNLOAD_ENGLISH_AUDIT_WIDTH: '1440'
          RUNLOAD_STAGE7_CAPTURE_ALL: '1'
        run: node tests/englishSurfaceAuditBrowser.mjs
      - name: Preserve cross-screen, English and 200-percent stage 7 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-integrated-${{ matrix.engine }}
          path: |
            audit-output/p8-font200-current-19-${{ matrix.engine }}-320-390-768.json
            audit-output/${{ matrix.engine }}-font200-*.png
            audit-output/english-surface-${{ matrix.engine }}-*/
          if-no-files-found: warn
          retention-days: 7
      - name: Inspect populated record and optional screens in Japanese and English at four widths
        run: node tests/recordOptionalDensityAuditBrowser.mjs
      - name: Preserve populated record / optional / review screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-optional-density-${{ matrix.engine }}
          path: audit-output/record-optional-density/
          if-no-files-found: warn
          retention-days: 7
      - name: Audit GPS post-measurement record review, consent, and 200-percent text
        run: node tests/gpsPostreviewZoomBrowser.mjs
      - name: Preserve GPS postreview responsive screenshot and scroll evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gps-postreview-zoom-${{ matrix.engine }}
          path: audit-output/gps-postreview-zoom/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify portable backup export, legacy restore and annotation provenance
        run: node tests/professorPortableV2Browser.mjs
      - name: Verify complete two-run cycle twice
        run: |
          for attempt in 1 2; do
            echo "Two-run cycle verification attempt ${attempt}/2"
            if node tests/twoRunCycleBrowserSmoke.mjs; then
              echo "Two-run cycle PASS on attempt ${attempt}"
            else
              echo "Two-run cycle FAIL on attempt ${attempt}"
              exit 1
            fi
          done

  screen-help-unified:
    name: S17 ${{ matrix.engine }} screen help location and design
    runs-on: ubuntu-24.04
    # Browser and operating-system dependencies are preinstalled at Playwright v1.56.1.
    # Avoid repeated network installations that have exhausted the WebKit job timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    # WebKit OS dependency setup can exceed 18 minutes on loaded CI runners.
    # Preserve all original Chromium/WebKit tests and assertions.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install supported browser test tool
        run: npm install --no-save playwright@1.56.1
      - name: Verify help at the upper-right in every active screen family
        run: node tests/screenHelpUnifiedBrowser.mjs
      - name: Preserve S17 cross-screen help geometry and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s17-help-${{ matrix.engine }}
          path: audit-output/s17-help-${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 7

  result-reflection-entry:
    name: G2 ${{ matrix.engine }} saved-result reflection round trip
    runs-on: ubuntu-24.04
    # Browser and operating-system dependencies are preinstalled at Playwright v1.56.1.
    # Avoid repeated network installations that have exhausted the WebKit job timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    # WebKit OS dependency setup can exceed 18 minutes on loaded CI runners.
    # Preserve all original Chromium/WebKit tests and assertions.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tool
        run: npm install --no-save playwright@1.56.1
      - name: Verify results to linked optional note and back
        run: node tests/resultReflectionEntryBrowser.mjs
      - name: Preserve G2 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-reflection-${{ matrix.engine }}
          path: audit-output/g2-reflection-${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 7

  reflection-g3-review:
    name: G3 ${{ matrix.engine }} exact-run notes, history and corrections
    runs-on: ubuntu-24.04
    # Browser and operating-system dependencies are preinstalled at Playwright v1.56.1.
    # Avoid repeated network installations that have exhausted the WebKit job timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    # WebKit OS dependency setup can exceed 18 minutes on loaded CI runners.
    # Preserve all original Chromium/WebKit tests and assertions.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tests
        run: npm install --no-save playwright@1.56.1
      - name: Verify selected run notes, edit and History round-trip
        run: node tests/reflectionG3Browser.mjs
      - name: Preserve G3 screenshots and counterexample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-reflection-${{ matrix.engine }}
          path: audit-output/g3-reflection-${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 7

  gps-reflection-g4b1:
    name: G4-B1 ${{ matrix.engine }} V1 upgrade and atomic dependent-data erasure
    runs-on: ubuntu-24.04
    # Browser and operating-system dependencies are preinstalled at Playwright v1.56.1.
    # Avoid repeated network installations that have exhausted the WebKit job timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    # WebKit OS dependency setup can exceed 18 minutes on loaded CI runners.
    # Preserve all original Chromium/WebKit tests and assertions.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install supported browser test tool
        run: npm install --no-save playwright@1.56.1
      - name: Reject GPS parent/child atomic deletion and migration regressions
        run: node tests/gpsReflectionSchemaUpgradeBrowser.mjs

  gps-reflection-g4b2:
    name: G4-B2 ${{ matrix.engine }} atomic GPS note revision and erasure
    runs-on: ubuntu-24.04
    # Browser and operating-system dependencies are preinstalled at Playwright v1.56.1.
    # Avoid repeated network installations that have exhausted the WebKit job timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    # OS dependency installation for WebKit can take ~20 min on loaded runners.
    # This is an execution limit change only; every browser test remains required.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install supported browser test tool
        run: npm install --no-save playwright@1.56.1
      - name: Audit exact GPS V2 parent, revision CAS, erasure and backup exclusion
        run: node tests/gpsReflectionAtomicWriterBrowser.mjs

  gps-reflection-g4c2:
    name: G4-C2 ${{ matrix.engine }} atomic GPS and private backup snapshot
    runs-on: ubuntu-24.04
    # Browser and operating-system dependencies are preinstalled at Playwright v1.56.1.
    # Avoid repeated network installations that have exhausted the WebKit job timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    # WebKit OS dependencies can exceed 20 minutes under concurrent CI load.
    # Keep mandatory browser acceptance unchanged; only extend the deadline.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tool
        run: npm install --no-save playwright@1.56.1
      - name: Verify read-only single transaction, opt-out and corrupt parent rejection
        run: node tests/gpsReflectionAtomicSnapshotBrowser.mjs

  gps-reflection-g4c4:
    name: G4-C4 ${{ matrix.engine }} four-store atomic GPS and private restore
    runs-on: ubuntu-24.04
    # Browser and operating-system dependencies are preinstalled at Playwright v1.56.1.
    # Avoid repeated network installations that have exhausted the WebKit job timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    # WebKit system dependencies may take >20 minutes under concurrent load.
    # Do not skip or weaken GPS rollback/retention browser evidence.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tool
        run: npm install --no-save playwright@1.56.1
      - name: Reject partial GPS and private restore, conflicts, and body resurrection
        run: node tests/gpsPrivateAtomicRestoreBrowser.mjs

  offline:
    name: Installed PWA offline storage and bilingual flow
    runs-on: ubuntu-24.04
    # Browser and operating-system dependencies are preinstalled at Playwright v1.56.1.
    # Avoid repeated network installations that have exhausted the WebKit job timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install supported browser test tool
        run: npm install --no-save playwright@1.56.1
      - name: Verify offline record, result, consultation, exploration and English
        run: node tests/offlineShellBrowserSmoke.mjs

  deployed-pages:
    name: Optional deployed Pages byte and live browser check
    if: ${{ vars.RUNLOAD_PAGES_URL != '' }}
    runs-on: ubuntu-24.04
    # Browser and operating-system dependencies are preinstalled at Playwright v1.56.1.
    # Avoid repeated network installations that have exhausted the WebKit job timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    env:
      RUNLOAD_PAGES_URL: ${{ vars.RUNLOAD_PAGES_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: npm install --no-save playwright@1.56.1
      - name: Verify matching deployed files and startup
        run: node tests/livePagesSmoke.mjs
