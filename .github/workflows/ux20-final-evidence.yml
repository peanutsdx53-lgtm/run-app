name: UX20 final cross-cutting evidence
on:
  push:
    branches: [diagnostics/ux20-final-20261125]
permissions:
  contents: read
jobs:
  final-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 602c47e1646bf2fe1b428a83834aa648bf97ed60
          path: exact-main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - name: Keyboard, original text and reduced motion
        run: RUNLOAD_ROOT="$PWD/exact-main" node tests/ux20FinalDiagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux20-final-${{ matrix.engine }}
          path: audit-output/ux20
          if-no-files-found: error
  deployed:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 602c47e1646bf2fe1b428a83834aa648bf97ed60
          path: exact-main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - name: Compare live precache resources and inspect deployed startup
        run: RUNLOAD_ROOT="$PWD/exact-main" node tests/ux20LiveDiagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux20-deployed
          path: audit-output/ux20-live
          if-no-files-found: error
