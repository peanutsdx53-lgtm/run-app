name: UX14 diagnostic layout A-B comparison
on:
  push:
    branches: ['diagnostics/ux14-layout-ab-20261124']
permissions:
  contents: read
jobs:
  compare:
    name: ${{ matrix.engine }} actual-app A-B geometry and interaction
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: node .github/diagnostics/ux14-layout-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux14-layout-ab-${{ matrix.engine }}
          path: audit-output/ux14-layout-ab-${{ matrix.engine }}/
          if-no-files-found: error
          retention-days: 7
