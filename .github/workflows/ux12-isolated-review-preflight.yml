name: UX12 isolated review preflight
on:
  push:
    branches: [diagnostics/ux12-review-pointer-20261124]
permissions:
  contents: read
concurrency:
  group: ux12-isolated-review-preflight
  cancel-in-progress: false
jobs:
  static:
    name: Verified candidate Node and scientific contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c5344685db1fb04a6546c04858ad19633bba932e
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all candidate source blobs before Node tests
        run: node harness/.github/diagnostics/ux12-verify-tree.mjs harness/.github/diagnostics/ux12-candidate-tree.json candidate c5344685db1fb04a6546c04858ad19633bba932e
      - run: node scripts/auditLocalDependencies.mjs
        working-directory: candidate
      - run: node scripts/auditPublicTerminology.mjs
        working-directory: candidate
      - run: node --test tests/*.test.mjs
        working-directory: candidate
  browser:
    name: ${{ matrix.engine }} verified isolated review and downstream regression
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      RUNLOAD_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9393602f8f28955e111b4b313b7f84b09589ceab
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c5344685db1fb04a6546c04858ad19633bba932e
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install supported browser test tool in shared parent
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify both independent source trees before any browser test
        id: identity
        shell: bash
        run: |
          mkdir -p identity-evidence
          node harness/.github/diagnostics/ux12-verify-tree.mjs harness/.github/diagnostics/ux12-baseline-tree.json baseline 9393602f8f28955e111b4b313b7f84b09589ceab | tee identity-evidence/baseline-before.json
          node harness/.github/diagnostics/ux12-verify-tree.mjs harness/.github/diagnostics/ux12-candidate-tree.json candidate c5344685db1fb04a6546c04858ad19633bba932e | tee identity-evidence/candidate-before.json
          (cd baseline && node --input-type=module -e "import('playwright').then(()=>console.log('baseline Playwright resolved'))")
          (cd candidate && node --input-type=module -e "import('playwright').then(()=>console.log('candidate Playwright resolved'))")
      - name: Baseline original Stage4 diagnostic (record actual outcome)
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: baseline
        shell: bash
        run: |
          mkdir -p audit-output/baseline-diagnostic
          set +e
          node tests/saveReviewStage4Browser.mjs > audit-output/baseline-diagnostic/stage4.log 2>&1
          code=$?
          set -e
          cat audit-output/baseline-diagnostic/stage4.log
          if [ "$code" -eq 0 ]; then
            outcome=NOT_REPRODUCED
          elif grep -Fq 'saveReviewStage4Browser.mjs:116:' audit-output/baseline-diagnostic/stage4.log && grep -Fq "waiting for locator('#runload-result-v4')" audit-output/baseline-diagnostic/stage4.log; then
            outcome=EXPECTED_RETRY_TIMEOUT_REPRODUCED
          else
            outcome=UNEXPECTED_FAILURE
          fi
          printf '{"exitCode":%s,"outcome":"%s"}\n' "$code" "$outcome" | tee audit-output/baseline-diagnostic/outcome.json
          test "$outcome" != UNEXPECTED_FAILURE
      - name: Candidate save failure and exact retry with mouse
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: candidate
        run: node tests/saveReviewStage4Browser.mjs
      - name: Candidate save failure and exact retry with touch
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: candidate
        env:
          RUNLOAD_STAGE4_ACTIVATION: touch
        run: node tests/saveReviewStage4Browser.mjs
      - name: Candidate save failure and exact retry with keyboard
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: candidate
        env:
          RUNLOAD_STAGE4_ACTIVATION: keyboard
        run: node tests/saveReviewStage4Browser.mjs
      - name: UX06 manual validation and duplicate-click integrity
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: candidate
        run: node tests/ux06ManualEntryBrowser.mjs
      - name: UX10 bilingual 32-state focus and privacy clearance
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: candidate
        run: node tests/ux10PresaveScopeBrowser.mjs
      - name: UX12 history filters and exact record IDs
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: candidate
        run: node tests/historyDiscoveryBrowser.mjs
      - name: GPS fixed controls and saved record integrity
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: candidate
        run: node tests/gpsRofReviewBrowser.mjs
      - name: Unified GPS manual history and three result tabs
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        working-directory: candidate
        run: node tests/gpsStage5HistoryResultBrowser.mjs
      - name: Verify both source trees remain unchanged after tests
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        shell: bash
        run: |
          node harness/.github/diagnostics/ux12-verify-tree.mjs harness/.github/diagnostics/ux12-baseline-tree.json baseline 9393602f8f28955e111b4b313b7f84b09589ceab | tee identity-evidence/baseline-after.json
          node harness/.github/diagnostics/ux12-verify-tree.mjs harness/.github/diagnostics/ux12-candidate-tree.json candidate c5344685db1fb04a6546c04858ad19633bba932e | tee identity-evidence/candidate-after.json
      - name: Preserve independent baseline candidate and identity evidence
        if: ${{ always() && steps.identity.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ux12-verified-isolated-review-${{ matrix.engine }}
          path: |
            identity-evidence/
            baseline/audit-output/
            candidate/audit-output/
          if-no-files-found: error
          retention-days: 7
